name: Sync Giornaliero Prezzi Futures da Gmail

on:
  schedule:
    # Esecuzione dal lunedì al venerdì alle 12:30 UTC (14:30 ora italiana)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # Permette anche l'avvio manuale con un clic su GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione Sync da Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -c "
          from execution.fetch_gmail_quotes import fetch_quotes_from_gmail
          q, l = fetch_quotes_from_gmail()
          print('Quotazioni estratte:', len(q))
          "

      - name: Commit e Push automatico delle nuove quotazioni
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna variazione al database, nessun commit necessario."
          else
            git commit -m "Auto-sync: nuove quotazioni futures grano duro da Gmail"
            git push
          fi
